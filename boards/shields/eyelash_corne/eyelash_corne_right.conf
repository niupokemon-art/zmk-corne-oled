# 使能 SPI 与电源
CONFIG_SPI=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_INPUT=y

# 使能显示驱动与屏显
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n

# === nice_oled 核心与自定义屏显开关 ===
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_OLED_ON=y

# === 开启右手 Layer（层级）显示 Widget ===
CONFIG_NICE_OLED_WIDGET_STATUS=y
CONFIG_NICE_OLED_WIDGET_LAYER=y

# === (可选) 关闭右手默认的猫咪/动画，为 Widget 腾出空间 ===
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n

# === (可选) 开启主副控电量同时显示 ===
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_AND_CENTRAL=y

# 关闭副控不需要的参数
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_SETTINGS_RPC=n
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
